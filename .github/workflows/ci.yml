name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin.json
        run: |
          python3 -c "
          import json, sys
          with open('.claude-plugin/plugin.json') as f:
              data = json.load(f)
          required = ['name', 'description', 'version', 'license', 'install']
          missing = [k for k in required if k not in data]
          if missing:
              print(f'plugin.json missing fields: {missing}', file=sys.stderr)
              sys.exit(1)
          print('plugin.json OK')
          "

      - name: Shellcheck setup.sh
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          severity: warning

      - name: Check markdown links (README)
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/mlc-config.json'
        continue-on-error: true  # advisory only — external links may be flaky
